name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m pip install dist/*.whl pytest
      - run: python -m pytest -q
      - name: CLI smoke tests
        run: |
          dry4swift --version
          dry4swift --help
      - name: Build Swift fixture package
        run: swift build --package-path tests/fixtures/package
      - name: End-to-end duplicate gate
        run: |
          set +e
          dry4swift --root tests/fixtures/package --min-tokens 8 --fail
          status=$?
          set -e
          test "$status" -eq 2
